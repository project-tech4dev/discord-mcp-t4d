# Installed as /etc/systemd/system/docker.service.d/discord-mcp-imds.conf.
# The containers have restart: unless-stopped, so after an unclean stop dockerd
# restarts them by itself, without discord-mcp.service and its checks. Docker
# must therefore not start at all unless the metadata block is in place.
[Unit]
Requires=discord-mcp-imds.service
After=discord-mcp-imds.service
