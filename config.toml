# discord-mcp configuration. No secrets go in this file; they come from
# environment variables.
#
# CHANNEL ALLOWLIST
# Unless allow_all_channels (below) is true, the server reads only the channels
# listed here, and each person still only sees the channels their Discord roles
# let them open.
#
# The list starts empty on purpose.
# Rollout begins with the common team channels and a pilot group. Internal team channels follow one team at a time,
# then cross-team channels with limited access.
# Leadership and HR channels are added last. Add a channel only after its owner agrees and its members know
# their messages are read for the digest, and give the bot role access to that
# channel in Discord at the same time. Record the rollout phase for each entry.
# Changes take effect after a restart.
#
# Example entry:
#   { id = "123456789012345678", name = "general", phase = 1 },
#
# Optional per-channel words that mark a message as worth a look in the
# channel overview (2-40 characters each, at most 30). Add words over time
# when Claude misses something:
#   { id = "123456789012345678", name = "events", phase = 1, watch = ["venue", "agenda", "rsvp", "deadline"] },
#
# Optional `pings = "direct_only"` for broadcast channels (announcements,
# notice boards): @here and role pings there, and in their threads, count as
# announcements, so only pings that name the person show as needing them. The
# channel stays fully readable for the overview, search and messages. In
# allowlist mode any entry, including one added only for `pings`, makes the
# channel readable.
#   { id = "123456789012345678", name = "announcements", phase = 1, pings = "direct_only" },
allowlist = []

# ALLOW ALL CHANNELS (instead of the allowlist)
# true: every text, announcement and forum channel the person can see is read,
# except the channel deny list below. Channels the bot itself cannot read show
# up as skipped. The allowlist then only supplies `watch` words and `pings` modes. Leave false to
# roll out channel by channel. Unknown top-level settings are rejected, so a
# misspelled deny list stops the server instead of being ignored.
allow_all_channels = false

# CHANNEL DENY LIST
# Channels, categories (denies every channel inside) or threads that no tool
# ever reads, for anyone, in either mode. Use it for leadership, HR and other
# private spaces.
# Example entry:
#   { id = "123456789012345678", note = "leadership" },
deny_channels = []

# ALLOWED ROLES
# Only members holding at least one of these roles may sign in or use any
# tool. Empty: every member of the Discord server. Checked on every call, so
# removing the role takes effect at once.
# Example:
#   allowed_roles = ["123456789012345678"]
allowed_roles = []

# DENY LIST (use rarely)
# Blocks one person from one channel even when their roles allow it. It is a
# second source of truth that people forget to update, so prefer fixing roles.
# Example entry:
#   { user_id = "123456789012345678", channel_id = "123456789012345678" },
deny = []

# TIME ZONE AND DATES (for deadlines in get_server_overview)
# "today", "Friday" and "EOD" resolve in this time zone (an IANA name).
timezone = "UTC"
# How "20/11" is read: "dmy" (day first) or "mdy" (month first).
date_order = "dmy"

[limits]
# Each limit below has a one-line meaning. Leave a limit out of your own
# config file to keep the value shown here.

# --- Time windows (days) ---
default_days = 7               # days looked back when Claude does not say how far (pings, channel overview)
max_days = 30                  # longest look-back for pings and channel messages, and for message links get_conversation opens
channel_default_days = 3       # days looked back by get_channel_messages when not told
overview_max_days = 30         # longest look-back for overviews, search and open loops

# --- How much text each message shows (characters) ---
text_chars = 1500              # longest message text shown in full views (pings, channel messages)
reply_chars = 200              # length of the quoted message a reply answers
summary_chars = 200            # message text length in compact rows (overviews, briefs, deadlines, shortened ping rows)
opening_chars = 300            # length of a topic's first message in overview rows

# --- get_channel_messages ---
channel_default_limit = 100    # messages returned when Claude does not ask for a number
channel_max_limit = 300        # most messages one call may return

# --- Grouping pings into conversations ---
conversation_gap_hours = 12    # silence (hours) after which the next message starts a new conversation
conversation_max_hours = 24    # longest a conversation may run before it is split
conversation_max_messages = 50 # most messages shown per conversation; at least 2 (first message and the ping are always kept)
row_max_pings = 5              # most pings listed in one conversation row of get_my_pings

# --- Size of one reply to Claude (characters) ---
max_result_chars = 40000       # cap on overview, search, brief, open-loop and get_conversation replies; extra rows are shortened or dropped
pings_max_chars = 60000        # same cap for get_my_pings, larger for busy weeks; if Claude Code refuses a result as too large, raise MAX_MCP_OUTPUT_TOKENS (see README)

# --- Channel overview rows ---
overview_latest = 2            # newest messages shown under each topic
overview_key_messages = 2      # extra flagged messages (questions, deadlines, watch words) from the middle of a topic
main_topic_gap_hours = 24      # in the main channel (not threads), silence that starts a new topic
main_topic_max_hours = 72      # longest a main-channel topic may run before it is split
search_matches_per_topic = 5   # most matching messages shown per topic in search

# --- Reading budgets (messages fetched from Discord per request) ---
overview_max_messages = 3000   # most messages read from any one channel or thread
overview_max_threads = 50      # one-channel tools read only the newest this-many threads
overview_request_messages = 15000  # rough message budget for one one-channel request, shared by its threads (each still gets at least 100)
server_request_messages = 30000    # total budget for server-wide tools (pings, server overview, open loops), split across channels; unused share goes to busy ones
server_max_threads = 200       # server-wide tools read only the newest this-many threads; the rest set `truncated`

# --- Open loops: how old something must be before it is flagged (days) ---
nudge_ask_days = 1             # your unanswered question, or your own promise
nudge_promise_days = 2         # a promise someone made to you
nudge_stall_days = 3           # a thread nobody has posted in

# --- Server overview / brief ---
brief_topics_per_channel = 3   # top topics listed per channel
brief_max_deadlines = 50       # most deadlines listed

# --- Abuse guard ---
calls_per_minute = 30          # tool calls one person may make in any 60 seconds
