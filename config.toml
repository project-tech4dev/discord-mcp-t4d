# discord-mcp configuration. No secrets go in this file; they come from
# environment variables.
#
# CHANNEL ALLOWLIST
# Unless allow_all_channels (below) is true, the server reads only the channels
# listed here, and each person still only sees the channels their Discord roles
# let them open.
#
# The list starts empty on purpose.
# Rollout begins with the common team channels and a pilot group. Internal team channels follow one team at a time,
# then cross-team channels with limited access.
# Leadership and HR channels are added last. Add a channel only after its owner agrees and its members know
# their messages are read for the digest, and give the bot role access to that
# channel in Discord at the same time. Record the rollout phase for each entry.
# Changes take effect after a restart.
#
# Example entry:
#   { id = "123456789012345678", name = "general", phase = 1 },
#
# Optional per-channel words that mark a message as worth a look in the
# channel overview (2-40 characters each, at most 30). Add words over time
# when Claude misses something:
#   { id = "123456789012345678", name = "grants", phase = 1, watch = ["submit", "due", "proposal", "draft"] },
#
# Optional `pings = "direct_only"` for broadcast channels (leave notices,
# social channels): @here and role pings there, and in their threads, count as
# announcements, so only pings that name the person show as needing them. The
# channel stays fully readable for the overview, search and messages. In
# allowlist mode any entry, including one added only for `pings`, makes the
# channel readable.
#   { id = "123456789012345678", name = "leave", phase = 1, pings = "direct_only" },
allowlist = []

# ALLOW ALL CHANNELS (instead of the allowlist)
# true: every text, announcement and forum channel the person can see is read,
# except the channel deny list below. Channels the bot itself cannot read show
# up as skipped. The allowlist then only supplies `watch` words and `pings` modes. Leave false to
# roll out channel by channel. Unknown top-level settings are rejected, so a
# misspelled deny list stops the server instead of being ignored.
allow_all_channels = false

# CHANNEL DENY LIST
# Channels, categories (denies every channel inside) or threads that no tool
# ever reads, for anyone, in either mode. Use it for leadership, HR and other
# private spaces.
# Example entry:
#   { id = "123456789012345678", note = "leadership" },
deny_channels = []

# DENY LIST (use rarely)
# Blocks one person from one channel even when their roles allow it. It is a
# second source of truth that people forget to update, so prefer fixing roles.
# Example entry:
#   { user_id = "123456789012345678", channel_id = "123456789012345678" },
deny = []

[limits]
default_days = 7
max_days = 14
text_chars = 1500
reply_chars = 200
channel_default_days = 3
channel_default_limit = 100
channel_max_limit = 300
conversation_gap_hours = 12
conversation_max_hours = 24
summary_chars = 200
max_result_chars = 40000
conversation_max_messages = 50
row_max_pings = 5
overview_max_days = 30
overview_latest = 2
overview_key_messages = 2
opening_chars = 300
main_topic_gap_hours = 24
main_topic_max_hours = 72
search_matches_per_topic = 5
overview_max_messages = 3000
overview_max_threads = 50
overview_request_messages = 15000
